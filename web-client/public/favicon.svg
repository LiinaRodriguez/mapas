<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Top Layer Gradient (Blue/Purple) -->
    <linearGradient id="topLayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <!-- Middle Layer Gradient (Teal/Emerald) -->
    <linearGradient id="midLayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    
    <!-- Bottom Layer Gradient (Amber/Orange) -->
    <linearGradient id="botLayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Shadows for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Bottom Layer -->
  <g filter="url(#shadow)">
    <polygon points="50,78 90,58 50,38 10,58" fill="url(#botLayer)" />
    <!-- 3D Edge -->
    <polygon points="50,86 90,66 90,58 50,78 10,58 10,66" fill="#b45309" opacity="0.9" />
  </g>

  <!-- Middle Layer -->
  <g filter="url(#shadow)">
    <polygon points="50,62 90,42 50,22 10,42" fill="url(#midLayer)" />
    <!-- 3D Edge -->
    <polygon points="50,70 90,50 90,42 50,62 10,42 10,50" fill="#047857" opacity="0.9" />
  </g>

  <!-- Top Layer -->
  <g filter="url(#shadow)">
    <polygon points="50,46 90,26 50,6 10,26" fill="url(#topLayer)" />
    <!-- 3D Edge -->
    <polygon points="50,54 90,34 90,26 50,46 10,26 10,34" fill="#1d4ed8" opacity="0.9" />
  </g>
  
  <!-- Map Pin / Location Marker on top -->
  <path d="M50,14 C46,14 43,17 43,21 C43,26 50,33 50,33 C50,33 57,26 57,21 C57,17 54,14 50,14 Z M50,23 C48.9,23 48,22.1 48,21 C48,19.9 48.9,19 50,19 C51.1,19 52,19.9 52,21 C52,22.1 51.1,23 50,23 Z" fill="#ffffff" filter="url(#shadow)"/>
</svg>